version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ml_studio_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=ML Studio
      - API_V1_STR=/api
      - DATABASE_URL=sqlite:////app/artifacts/ml_studio.db
      - DATA_DIR=/app/artifacts/datasets
      - ARTIFACTS_DIR=/app/artifacts/models
    volumes:
      - ml_studio_data:/app/artifacts

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ml_studio_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  ml_studio_data:
    driver: local
